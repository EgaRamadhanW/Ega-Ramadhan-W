              <table border="0" cellspacing="0" cellpadding="0">
                <tr>
                  <td valign="middle"><h1><font size="7" color="#FBF4E4" face="Arial Black, Arial, sans-serif">Buku Tamu</font></h1></td>

  <table width="100%" border="0" cellspacing="0" cellpadding="0" bgcolor="#0D4D48">
    <tr>
      <td align="center">
        <table width="900" border="0" cellspacing="0" cellpadding="20">
          <tr>
            <td align="center">

              <form action="#" method="post">
                <table width="620" border="0" cellspacing="0" cellpadding="12" bgcolor="#FBF4E4">
                  <tr bgcolor="#F4CF63">
                    <td colspan="2" align="center">
                      <font color="#0B3D39" size="4"><b>Formulir Buku Tamu</b></font>
                    </td>
                  </tr>
                  <tr>
                    <td width="30%" valign="top"><font color="#0B3D39"><b><label for="nama">Nama</label></b></font></td>
                    <td><input type="text" id="nama" name="nama" size="40" required></td>
                  </tr>
                  <tr bgcolor="#F0E8D4">
                    <td valign="top"><font color="#0B3D39"><b><label for="email">Email</label></b></font></td>
                    <td><input type="email" id="email" name="email" size="40" required></td>
                  </tr>
                  <tr>
                    <td valign="top"><font color="#0B3D39"><b>Jenis Kelamin</b></font></td>
                    <td>
                      <font color="#0B3D39">
                        <input type="radio" id="lk" name="jk" value="Laki-laki" checked> <label for="lk">Laki-laki</label>
                        &nbsp;&nbsp;
                        <input type="radio" id="pr" name="jk" value="Perempuan"> <label for="pr">Perempuan</label>
                      </font>
                    </td>
                  </tr>
                  <tr bgcolor="#F0E8D4">
                    <td valign="top"><font color="#0B3D39"><b><label for="pesan">Pesan / Kesan</label></b></font></td>
                    <td><textarea id="pesan" name="pesan" rows="6" cols="40"></textarea></td>
                  </tr>
                  <tr bgcolor="#F4CF63">
                    <td colspan="2" align="center">
                      <input type="submit" value="Kirim Pesan">
                      <input type="reset" value="Reset">
                    </td>
                  </tr>
                </table>
              </form>

            </td>
          </tr>
